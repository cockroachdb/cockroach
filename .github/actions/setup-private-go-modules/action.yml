name: "Setup private Go module auth"
description: >-
  Fetches a GitHub App credential pair from GCP Secret Manager, mints
  one installation token per org the App is installed on, and
  configures git + GOPRIVATE so subsequent `go list`/`go mod` calls
  can fetch private cockroachlabs/* and cockroachdb/* modules. Caller
  must invoke ./build/github/cleanup-go-module-auth.sh in its own
  cleanup step — composite actions can't register post-job hooks.

runs:
  using: "composite"
  steps:
    - run: ./build/github/get-github-app-creds.sh
      shell: bash
    # Mint one installation token per org. The App is installed on
    # both cockroachlabs (scoped to roachmgr) and cockroachdb (scoped
    # to pebble-private); each action invocation returns a token
    # valid for one installation only.
    #
    # Pinned to v3.2.0. Third-party actions must be pinned to a full
    # commit SHA to guarantee immutability.
    - name: mint GitHub App token (cockroachlabs)
      id: go-deps-app-token-cockroachlabs
      uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
      with:
        app-id: ${{ env.GO_DEPS_APP_ID }}
        private-key: ${{ env.GO_DEPS_APP_PRIVATE_KEY }}
        owner: cockroachlabs
        repositories: roachmgr
    - name: mint GitHub App token (cockroachdb)
      id: go-deps-app-token-cockroachdb
      uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
      with:
        app-id: ${{ env.GO_DEPS_APP_ID }}
        private-key: ${{ env.GO_DEPS_APP_PRIVATE_KEY }}
        owner: cockroachdb
        repositories: pebble-private
    - name: configure git/Go for private modules
      env:
        GH_APP_TOKEN_COCKROACHLABS: ${{ steps.go-deps-app-token-cockroachlabs.outputs.token }}
        GH_APP_TOKEN_COCKROACHDB: ${{ steps.go-deps-app-token-cockroachdb.outputs.token }}
      run: ./build/github/configure-go-module-auth.sh
      shell: bash

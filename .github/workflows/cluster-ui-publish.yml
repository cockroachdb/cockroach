name: Publish Cluster UI
on:
  workflow_dispatch:
  push:
    branches:
      - master
      - 'release-*'
    paths:
      - 'pkg/ui/workspaces/cluster-ui/**/*.tsx?'
      - 'pkg/ui/workspaces/cluster-ui/package.json'

# A single workflow publishes @cockroachlabs/cluster-ui for both master
# (pre-release, dist-tag "next") and release-* branches (dist-tag equal to
# the branch name, e.g. "release-26.3"). npm trusted publishing binds a
# package to exactly one workflow file, so both cases must live here.
jobs:
  publish_cluster_ui:
    if: github.repository == 'cockroachlabs/cockroach'
    runs-on: ubuntu-latest
    permissions:
      id-token: write # Required for OIDC (npm trusted publishing)
      contents: write # Required for git tagging
    defaults:
      run:
        working-directory: pkg/ui/workspaces/cluster-ui

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: true

    - name: Bazel Cache
      uses: actions/cache@v4
      with:
        path: ~/.cache/bazel
        key: ${{ runner.os }}-bazel-cache

    - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4
      with:
        version: "9.15.5"

      # Publishing authenticates to npm via OIDC trusted publishing, so no
      # NODE_AUTH_TOKEN is configured here.
    - name: Setup NodeJS
      uses: actions/setup-node@v4
      with:
        node-version: 22
        registry-url: 'https://registry.npmjs.org'
        always-auth: true
        cache: 'pnpm'
        cache-dependency-path: "${{ github.workspace }}/pkg/ui/pnpm-lock.yaml"

      # Always install node dependencies. It seems silly to do if we're not
      # going to actually use them, but setup-node's post-run action attempts
      # to save dependencies to a cache shared between GitHub actions. If the
      # pnpm store directory doesn't exist (e.g. during a cache miss), that
      # cache-saving step will fail and the entire job will be marked "failed"
      # as a result. Installing dependencies is the canonical way to seed the
      # pnpm store from-scratch.
    - name: Install dependencies
      run: pnpm install --frozen-lockfile

    - name: Check if version is published
      id: version-check
      shell: bash
      run: |
        PACKAGE_VERSION=$(cat ./package.json | jq -r ".version");
        VERSIONS=$(npm view @cockroachlabs/cluster-ui versions)
        if [[ $VERSIONS == *\'"$PACKAGE_VERSION"\'* ]]; then
          echo "published=yes" >> $GITHUB_OUTPUT
          echo
          echo "🛑 Cluster UI package version $PACKAGE_VERSION is already published"
          echo "to npm. Publishing step should be skipped. 🛑"
        else
          echo "published=no" >> $GITHUB_OUTPUT
          echo
          echo "✅ Cluster UI package version $PACKAGE_VERSION should be published. ✅"
        fi

      # Pre-releases from master go out under the "next" dist-tag; publishes
      # from a release branch use the branch name (e.g. "release-26.3") so each
      # release series has its own tag. Versions carrying an "-alt." prerelease
      # identifier always publish under the "alt" dist-tag, regardless of which
      # branch they are published from, so an alt build never lands on
      # "next"/"latest" or a release-series tag.
    - name: Determine npm dist-tag
      id: dist-tag
      shell: bash
      run: |
        PACKAGE_VERSION=$(jq -r ".version" ./package.json)
        if [[ "$PACKAGE_VERSION" == *-alt.* ]]; then
          echo "tag=alt" >> "$GITHUB_OUTPUT"
        elif [[ "$GITHUB_REF" == "refs/heads/master" ]]; then
          echo "tag=next" >> "$GITHUB_OUTPUT"
        else
          echo "tag=${GITHUB_REF#refs/heads/}" >> "$GITHUB_OUTPUT"
        fi

    - name: Build Cluster UI
      if: steps.version-check.outputs.published == 'no'
      run: |
        bazel build //pkg/ui/workspaces/db-console/src/js:crdb-protobuf-client
        cp ../../../../_bazel/bin/pkg/ui/workspaces/db-console/src/js/protos.* ../db-console/src/js/
        pnpm build:release

      # Consult the remote, not local tags: the CI checkout does not fetch
      # these tags, so a local `git tag -l` check always misses an
      # already-pushed tag and fails the push. `git ls-remote` emits a
      # trailing "^{}" line carrying the commit SHA for annotated tags, so
      # tail -n1 yields the commit for both tag kinds (empty when absent).
      #
      # An existing tag must point at the commit being published. If it points
      # elsewhere, the package version was not bumped for a new commit, so fail
      # loudly rather than publish a version whose git tag disagrees with the
      # published artifact.
    - name: Create version tag and push
      if: steps.version-check.outputs.published == 'no'
      run: |
        TAGNAME="@cockroachlabs/cluster-ui@$(jq -r '.version' ./package.json)"
        REMOTE_SHA="$(git ls-remote --tags origin "refs/tags/$TAGNAME" | tail -n1 | cut -f1)"
        HEAD_SHA="$(git rev-parse HEAD)"
        if [ -z "$REMOTE_SHA" ]; then
          git tag "$TAGNAME"
          git push origin "$TAGNAME"
        elif [ "$REMOTE_SHA" = "$HEAD_SHA" ]; then
          echo "Tag $TAGNAME already exists at $HEAD_SHA; skipping tag push."
        else
          echo "::error::Tag $TAGNAME already exists at $REMOTE_SHA but the commit being published is $HEAD_SHA. Bump the package version instead of publishing a different commit under an existing tag."
          exit 1
        fi

      # npm trusted publishing (OIDC) requires npm >= 11.5.1 and Node >= 22.14;
      # the runner's bundled npm may be older, so install a compatible version.
      # The upload uses npm rather than pnpm because the repo's pinned pnpm
      # (9.15.5) predates pnpm's OIDC trusted-publishing support (added in
      # pnpm 10).
    - name: Upgrade npm for OIDC trusted publishing
      if: steps.version-check.outputs.published == 'no'
      run: npm install -g npm@11.5.1

    - name: Publish
      if: steps.version-check.outputs.published == 'no'
      run: npm publish --access public --tag ${{ steps.dist-tag.outputs.tag }} --ignore-scripts

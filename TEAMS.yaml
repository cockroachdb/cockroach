# This is a YAML file mapping team aliases from GitHub to
# metadata about the team.
# Expected structure is available in pkg/internal/team/team.go.

cockroachlabs/docs:
  aliases:
    cockroachlabs/docs-infra-prs: other
cockroachlabs/sql-foundations:
  aliases:
    cockroachlabs/sql-api-prs: other
  label: T-sql-foundations
cockroachlabs/sqlproxy-prs:
  label: T-cloud-platform
cockroachlabs/sql-queries:
  aliases:
    cockroachlabs/sql-queries-prs: other
    cockroachlabs/sql-optimizer: other
    cockroachlabs/sql-opt-prs: other
  # SQL Queries team uses GH projects v2.
  # See .github/workflows/add-issues-to-project.yml.
  label: T-sql-queries
  silence_mentions: true
cockroachlabs/kv:
  aliases:
    cockroachlabs/kv-triage: roachtest
    # This is a hack - we can't have the same key twice,
    # but it also doesn't seem worth rewriting the aliases
    # into slice form for just this.
    'cockroachlabs/kv-triage ': unittest
    cockroachlabs/kv-prs: other
    cockroachlabs/kv-distribution: other
  label: T-kv
cockroachlabs/admission-control:
  label: T-kv,A-admission-control
cockroachlabs/spatial:
  label: T-spatial
cockroachlabs/dev-inf:
  label: T-dev-inf
cockroachlabs/drp-eng:
  label: T-drpeng
cockroachlabs/multiregion:
  label: T-multiregion
cockroachlabs/storage:
  label: T-storage
cockroachlabs/test-eng:
  label: T-testeng
cockroachlabs/test-eng-prs:
  label: T-testeng
cockroachlabs/security-engineering:
  label: T-security-engineering
cockroachlabs/product-security:
  label: T-product-security
cockroachlabs/disaster-recovery:
  label: T-disaster-recovery
cockroachlabs/cdc:
  aliases:
    cockroachlabs/cdc-prs: other
  # CDC team uses GH projects v2, which doesn't have a REST API, so no triage column ID
  # see .github/workflows/add-issues-to-project.yml
  label: T-cdc
cockroachlabs/server:
  aliases:
    cockroachlabs/cli-prs: other
    cockroachlabs/server-prs: other
  label: T-db-server
cockroachlabs/obs-prs:
  # The observability team uses Jira for managing issues. So there is no triage column ID.
  label: T-observability
cockroachlabs/obs-india-prs:
cockroachlabs/jobs:
  aliases:
    cockroachlabs/jobs-prs: other
  # Jobs uses GH projects v2, which doesn't have a REST API, so no triage column ID
  # see .github/workflows/add-issues-to-project.yml
  label: T-jobs
cockroachlabs/cloud-identity:
cockroachlabs/unowned:
  aliases:
    cockroachlabs/rfc-prs: other
cockroachlabs/migrations:
  label: T-migrations
cockroachlabs/release-eng:
  aliases:
    cockroachlabs/release-eng-prs: other
    cockroachlabs/upgrade-prs: other
  label: T-release
cockroachlabs/field-engineering:
  # Field Eng isn't currently using github projects.
  label: T-field-eng
